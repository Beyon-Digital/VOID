[package]
name = "void-symbolic-worker"
version = "1.0.0"
edition = "2021"
description = "VOID symbolic-completion worker (protocol v1): deterministic seeded interval-Markov continuation generator. Real algorithmic proposals — never canned output."
license = "ISC"

# Detached from the repo workspace: a worker bundle builds alone.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "void-symbolic-worker"
path = "src/main.rs"
