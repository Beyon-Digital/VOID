[workspace]
resolver = "2"
members = [
    "crates/void-protocol",
    "crates/void-worker",
    "crates/void-app",
    "crates/void-project",
    "crates/void-assets",
    "crates/void-jobs",
    "crates/void-models",
    "crates/void-proposals",
    "crates/void-producer",
    "crates/void-export",
    "crates/void-content",
    "crates/void-visual",
    "crates/void-mix",
    "crates/void-exchange",
    "crates/void-spatial",
    "crates/void-sync",
    "crates/void-wasm",
    "apps/void-tauri/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "ISC"
repository = "https://github.com/Beyon-Digital/VOID"

# Integrator-owned lockfile: Cargo.lock is committed; lanes do not edit
# root manifests without coordinating (docs/void-handoff/HANDOFF.md §7).
[workspace.dependencies]
flatbuffers = "=25.9.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"
# W28 lane (void-wasm): wasmtime is the EXT-01-selected restricted
# runtime (Apache-2.0 + LLVM exception). Exact pins — security surface,
# no floating ranges. `wat` is dev-only (test fixtures).
wasmtime = "=37.0.2"
wasmparser = "=0.259.0"
wat = "=1.259.0"

[profile.release]
# Keep debug symbols for diagnostics; LTO for binary size.
lto = "thin"
debug = true
