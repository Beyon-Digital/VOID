[package]
name = "void-recovery-tests"
description = "W05 recovery failpoint suite (T17–T21) — crash-consistent checkpoint evidence"
version = "0.1.0"
edition = "2021"
publish = false

# Own workspace: the root Cargo.toml members list is integrator-owned —
# this suite builds standalone via `cargo test --manifest-path`.
[workspace]

[dependencies]
void-project = { path = "../../crates/void-project" }
void-assets = { path = "../../crates/void-assets" }
void-jobs = { path = "../../crates/void-jobs" }
void-protocol = { path = "../../crates/void-protocol" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
libc = "0.2"
tempfile = "3"
