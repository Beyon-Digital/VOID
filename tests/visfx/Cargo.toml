[package]
name = "void-visfx-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Detached suite: not part of the main workspace — run with
# `cargo test --manifest-path tests/visfx/Cargo.toml`.
[workspace]

[dependencies]
void-visfx = { path = "../../crates/void-visfx" }
void-jobs = { path = "../../crates/void-jobs" }
void-assets = { path = "../../crates/void-assets" }
void-visual = { path = "../../crates/void-visual" }
void-protocol = { path = "../../crates/void-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "visfx_fake_worker"
path = "src/bin/visfx_fake_worker.rs"
