[package]
name = "void-content-tests"
description = "W19 content-pack + stock-inventory suite (T73 model halves) — manifests, zones, lifecycle, rights"
version = "0.1.0"
edition = "2021"
publish = false

# Own workspace: the root Cargo.toml members list is integrator-owned —
# this suite builds standalone via `cargo test --manifest-path`.
[workspace]

[dependencies]
void-assets = { path = "../../crates/void-assets" }
void-content = { path = "../../crates/void-content" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
