[package]
name = "void-journeys-ai"
description = "W16 F2 regression gate — T63 storm / T65 capability evidence / proposal invalidation / latency (real JobRunner + real workers)"
version = "0.1.0"
edition = "2021"
publish = false

# Own workspace: the root Cargo.toml members list is integrator-owned —
# this suite builds standalone via `cargo test --manifest-path`.
[workspace]

[dependencies]
void-assets = { path = "../../../crates/void-assets" }
void-jobs = { path = "../../../crates/void-jobs" }
void-project = { path = "../../../crates/void-project" }
void-proposals = { path = "../../../crates/void-proposals" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
libc = "0.2"
