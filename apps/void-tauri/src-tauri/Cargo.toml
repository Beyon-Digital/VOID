[package]
name = "void-tauri"
description = "VOID Tauri application shell — owns workers, IPC, menus, native windows"
version.workspace = true
edition.workspace = true

[lib]
name = "void_tauri_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "void-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Updater channel (T28/W07): verifies signed update manifests served from the
# GitHub Releases endpoint configured in tauri.conf.json. Signing keys are
# env-gated (TAURI_SIGNING_PRIVATE_KEY) — see docs/ops/UPDATER.md; with no key
# present the build still succeeds but produces no signed updater artifacts.
tauri-plugin-updater = "2"
void-app = { path = "../../../crates/void-app" }
void-worker = { path = "../../../crates/void-worker" }
void-protocol = { path = "../../../crates/void-protocol" }
flatbuffers = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
