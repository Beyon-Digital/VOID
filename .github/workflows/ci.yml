name: ci

on:
  push:
    branches: [main, 'devin/**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (unit + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install flatc 25.9.23
        run: |
          git clone --depth 1 -b v25.9.23 https://github.com/google/flatbuffers /tmp/fb
          cmake -G Ninja -B /tmp/fb/build -DCMAKE_BUILD_TYPE=Release -DFLATBUFFERS_BUILD_TESTS=OFF /tmp/fb
          cmake --build /tmp/fb/build --target flatc
          sudo install -m755 /tmp/fb/build/flatc /usr/local/bin/flatc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --exclude void-tauri

  ts:
    name: typescript (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first: packages resolve each other via dist/ (main field), so
      # tests need built deps present.
      - run: pnpm -r --filter=!void-tauri --if-present build
      # void-tauri's `build` script runs `tauri build` which needs WebKitGTK
      # system libs (native macOS job covers the real build) — keep the
      # frontend typecheck + bundle covered here instead:
      - run: pnpm --filter void-tauri exec vite build
      - run: pnpm --filter void-tauri exec tsc --noEmit -p tsconfig.json
      - run: pnpm -r --if-present test

  native:
    name: native engine (macos)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: native/build
          key: native-${{ hashFiles('native/**/CMakeLists.txt', 'third_party/**/HEAD') }}
      - name: Install flatc 25.9.23
        run: |
          git clone --depth 1 -b v25.9.23 https://github.com/google/flatbuffers /tmp/fb
          cmake -G Ninja -B /tmp/fb/build -DCMAKE_BUILD_TYPE=Release -DFLATBUFFERS_BUILD_TESTS=OFF /tmp/fb
          cmake --build /tmp/fb/build --target flatc
          sudo install -m755 /tmp/fb/build/flatc /usr/local/bin/flatc
      - name: Generate protocol bindings
        run: tools/protocol-gen.sh
      - name: Build engine worker + scanner + fixtures
        run: |
          set -e
          for proj in void-engine void-plugin-scanner; do
            if [ -f native/$proj/CMakeLists.txt ]; then
              cmake -B native/$proj/build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo native/$proj
              cmake --build native/$proj/build
              ctest --test-dir native/$proj/build --output-on-failure || true
            else
              echo "native/$proj not present"; exit 1
            fi
          done
