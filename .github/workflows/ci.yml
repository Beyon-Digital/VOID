name: ci

on:
  push:
    branches: [main, 'devin/**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (unit + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install flatc 25.9.23
        run: |
          git clone --depth 1 -b v25.9.23 https://github.com/google/flatbuffers /tmp/fb
          cmake -G Ninja -B /tmp/fb/build -DCMAKE_BUILD_TYPE=Release -DFLATBUFFERS_BUILD_TESTS=OFF /tmp/fb
          cmake --build /tmp/fb/build --target flatc
          sudo install -m755 /tmp/fb/build/flatc /usr/local/bin/flatc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ hashFiles('**/Cargo.lock') }}
      # void-tauri is a workspace member; clippy --workspace compiles its
      # gtk/glib dep tree, so the lint job needs the system libs.
      - name: Install WebKitGTK build deps (for void-tauri lint coverage)
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --exclude void-tauri

  ts:
    name: typescript (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first: packages resolve each other via dist/ (main field), so
      # tests need built deps present.
      - run: pnpm -r --filter=!void-tauri --if-present build
      # void-tauri's `build` script runs `tauri build` which needs WebKitGTK
      # system libs (native macOS job covers the real build) — keep the
      # frontend typecheck + bundle covered here instead:
      - run: pnpm --filter void-tauri exec vite build
      - run: pnpm --filter void-tauri exec tsc --noEmit -p tsconfig.json
      - run: pnpm -r --if-present test

  native:
    name: native engine (macos)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: native/build
          key: native-${{ hashFiles('native/**/CMakeLists.txt', 'third_party/**/HEAD') }}
      # tracktion_engine needs Apple clang >=16 (C++20 parenthesized
      # aggregate init); the runner's default Xcode 15.4 cannot build it.
      - name: Select newest installed Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
      - name: Install flatc 25.9.23
        run: |
          git clone --depth 1 -b v25.9.23 https://github.com/google/flatbuffers /tmp/fb
          cmake -G Ninja -B /tmp/fb/build -DCMAKE_BUILD_TYPE=Release -DFLATBUFFERS_BUILD_TESTS=OFF /tmp/fb
          cmake --build /tmp/fb/build --target flatc
          sudo install -m755 /tmp/fb/build/flatc /usr/local/bin/flatc
      - name: Generate protocol bindings
        run: tools/protocol-gen.sh
      - name: Build engine worker + scanner + fixtures
        run: |
          set -e
          for proj in void-engine void-plugin-scanner; do
            if [ -f native/$proj/CMakeLists.txt ]; then
              cmake -B native/$proj/build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo native/$proj
              cmake --build native/$proj/build
              ctest --test-dir native/$proj/build --output-on-failure || true
            else
              echo "native/$proj not present"; exit 1
            fi
          done

  # --- Lane AA additions (W07/T25 build matrix, T04/T29 audit tooling) --------
  # Job inventory rationale: docs/ops/BUILD_MATRIX.md.

  rust-windows:
    name: rust (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Windows divergence from the verbatim recipe: no sudo; the default
      # generator (VS) emits flatc.exe under Release/, added to PATH.
      - name: Install flatc 25.9.23
        shell: bash
        run: |
          git clone --depth 1 -b v25.9.23 https://github.com/google/flatbuffers /tmp/fb
          cmake -B /tmp/fb/build -DCMAKE_BUILD_TYPE=Release -DFLATBUFFERS_BUILD_TESTS=OFF /tmp/fb
          cmake --build /tmp/fb/build --config Release --target flatc
          echo "/tmp/fb/build/Release" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-windows-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fmt --all -- --check
      # void-worker (Unix-domain-socket transport) and its dependents
      # void-app/void-tauri do not compile on Windows — excluded here. Every
      # other workspace crate is checked and tested: the maximal portable
      # subset, a superset of the T25-suggested -p void-protocol/-p void-jobs
      # suites.
      - run: cargo check --workspace --exclude void-tauri --exclude void-app --exclude void-worker
      - run: cargo test --workspace --exclude void-tauri --exclude void-app --exclude void-worker

  rust-macos:
    name: rust (macos)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install flatc 25.9.23
        run: |
          git clone --depth 1 -b v25.9.23 https://github.com/google/flatbuffers /tmp/fb
          cmake -G Ninja -B /tmp/fb/build -DCMAKE_BUILD_TYPE=Release -DFLATBUFFERS_BUILD_TESTS=OFF /tmp/fb
          cmake --build /tmp/fb/build --target flatc
          sudo install -m755 /tmp/fb/build/flatc /usr/local/bin/flatc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-macos-${{ hashFiles('**/Cargo.lock') }}
      # Same gate as the ubuntu rust job: the whole workspace minus the GUI
      # crate (void-tauri needs a display; macOS GUI qualification is F5-N02).
      - run: cargo test --workspace --exclude void-tauri

  ts-macos:
    name: typescript (macos)
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter=!void-tauri --if-present build
      - run: pnpm --filter void-tauri exec vite build
      - run: pnpm --filter void-tauri exec tsc --noEmit -p tsconfig.json
      - run: pnpm -r --if-present test

  ts-windows:
    name: typescript (windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter=!void-tauri --if-present build
      - run: pnpm --filter void-tauri exec vite build
      - run: pnpm --filter void-tauri exec tsc --noEmit -p tsconfig.json
      - run: pnpm -r --if-present test

  audit:
    name: privacy + supply-chain audit (T04/T29 tooling)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install flatc 25.9.23
        run: |
          git clone --depth 1 -b v25.9.23 https://github.com/google/flatbuffers /tmp/fb
          cmake -G Ninja -B /tmp/fb/build -DCMAKE_BUILD_TYPE=Release -DFLATBUFFERS_BUILD_TESTS=OFF /tmp/fb
          cmake --build /tmp/fb/build --target flatc
          sudo install -m755 /tmp/fb/build/flatc /usr/local/bin/flatc
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: bash tools/privacy-audit.sh
      - run: bash tools/supplychain-check.sh
