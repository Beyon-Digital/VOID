[package]
name = "void-exchange"
description = "VOID interchange + plugin compatibility — DAWproject subset, SMF, stems manifest, deterministic loss reports, plugin registry, preserved state, isolation policy (W20, CONTRACTS.md §7)"
version.workspace = true
edition.workspace = true

[dependencies]
void-protocol = { path = "../void-protocol" }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true, features = ["v5"] }
tracing = { workspace = true }
# Already in the tree (tests/recovery, tauri plist): pinned to the locked
# versions so resolution does not churn the integrator-owned lockfile.
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "=0.42.0"

[dev-dependencies]
tempfile = "3"
